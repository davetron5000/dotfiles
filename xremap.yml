# Should be symlinked to ~/.config/xremap/xremap.yml
keymap:
  - name: Firefox
    application:
      only: "firefox_firefox"
    remap:
      Alt-c: C-c
      Alt-v: C-v
      Alt-t: C-t
      Alt-LeftBrace: C-LeftBrace
      Alt-f: C-f
      Alt-g: C-g
      Alt-l: C-j
      Alt-w: C-w
      Alt-r: C-r
      Alt-Shift-LeftBrace: C-PageUp
      Alt-Shift-RightBrace: C-PageDown
      Alt-Shift-p: C-Shift-p
  - name: Firefox
    application:
      only: "firefox"
    remap:
      Alt-c: C-c
      Alt-v: C-v
      Alt-t: C-t
      Alt-LeftBrace: C-LeftBrace
      Alt-f: C-f
      Alt-g: C-g
      Alt-l: C-j
      Alt-k: C-k
      Alt-w: C-w
      Alt-r: C-r
      Alt-Shift-LeftBrace: C-PageUp
      Alt-Shift-RightBrace: C-PageDown
      Alt-Shift-p: C-Shift-p
  - name: FirefoxPWA
    application:
      only: /^FFPWA/
    remap:
      Alt-c: C-c
      Alt-v: C-v
      Alt-t: C-t
      Alt-LeftBrace: C-LeftBrace
      Alt-f: C-f
      Alt-g: C-g
      Alt-l: C-j
      Alt-k: C-k
      Alt-w: C-w
      Alt-r: C-r
      Alt-Shift-LeftBrace: C-PageUp
      Alt-Shift-RightBrace: C-PageDown
      Alt-Shift-p: C-Shift-p
  - name: Chromium
    application:
      only: "chromium"
    remap:
      Alt-c: C-c
      Alt-v: C-v
      Alt-t: C-t
      Alt-LeftBrace: C-LeftBrace
      Alt-f: C-f
      Alt-g: C-g
      Alt-l: C-j
      Alt-w: C-w
      Alt-r: C-r
      Alt-Shift-LeftBrace: C-PageUp
      Alt-Shift-RightBrace: C-PageDown
      Alt-Shift-p: C-Shift-p
  - name: Ulauncher
    application:
      only: "Ulauncher"
    remap:
      Alt-c: C-c
      Alt-v: C-v
  - name: Fastmail
    application:
      only: "Fastmail"
    remap:
      Alt-c: C-c
      Alt-v: C-v
